<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать книгу</title>
</head>
<body>
<h2>Редактировать книгу</h2>

<form th:action="@{/book}" th:object="${book}" method="post">
    <input type="hidden" name="_method" value="put" />
    <input type="hidden" th:field="*{id}" />

    <label>Название: <input type="text" th:field="*{title}" required /></label><br/><br/>

    <label>Автор: <input type="text" th:field="*{author}" required /></label><br/><br/>

    <label>ISBN: <input type="text" th:field="*{isbn}" required /></label><br/><br/>

    <button type="submit">Сохранить изменения</button>
</form>

<a th:href="@{/book}">Назад к списку книг</a>
</body>
</html>
