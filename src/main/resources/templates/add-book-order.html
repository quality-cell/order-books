<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Взять книгу</title>
</head>
<body>
<h1>Оформить выдачу книги</h1>

<form th:action="@{/book-order}" th:object="${order}" method="post">

    <label>Клиент:
        <select th:field="*{client.id}" required>
            <option value="">-- Выберите клиента --</option>
            <option th:each="c : ${clients}"
                    th:value="${c.id}"
                    th:text="${c.fullName}">Иванов И.И.</option>
        </select>
    </label><br/><br/>

    <label>Книга:
        <select th:field="*{book.id}" required>
            <option value="">-- Выберите книгу --</option>
            <option th:each="b : ${books}"
                    th:value="${b.id}"
                    th:text="${b.title + ' (' + b.author + ')'}">Война и мир (Толстой)</option>
        </select>
    </label><br/><br/>

    <label>Дата выдачи: <input type="date" th:field="*{dateBegin}" required /></label><br/><br/>
    <label>Дата возврата: <input type="date" th:field="*{dateEnd}" required /></label><br/><br/>

    <button type="submit">Выдать книгу</button>
</form>
</body>
</html>
