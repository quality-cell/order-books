<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Выданные книги</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    .table-container { margin-top: 20px; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="container">
  <h1 class="mb-4">📖 Список выданных книг</h1>

  <div th:replace="message :: error-alert"></div>
  <div th:replace="message :: success-alert"></div>

  <a th:href="@{/book-order/new}" class="btn btn-primary mb-3">➕ Новая выдача</a>

  <div class="table-container">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Клиент</th>
        <th scope="col">Книга</th>
        <th scope="col">Дата выдачи</th>
        <th scope="col">Дата возврата</th>
        <th scope="col">Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${orders.empty}">
        <td colspan="5" class="text-center text-muted">Нет выданных книг</td>
      </tr>

      <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${order.client.fullName}">Иванов И.И.</td>
        <td th:text="${order.book.title + ' (' + order.book.author + ')'}">Война и мир (Лев Толстой)</td>
        <td th:text="${#temporals.format(order.dateBegin, 'dd.MM.yyyy')}">01.10.2025</td>
        <td th:text="${#temporals.format(order.dateEnd, 'dd.MM.yyyy')}">15.10.2025</td>
        <td>
          <a th:href="@{/book-order/edit/{orderId}(orderId=${order.id})}"
             class="btn btn-sm btn-outline-warning me-1">✏️ Редактировать</a>

          <form th:action="@{/book-order/{orderId}(orderId=${order.id})}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Вы уверены, что хотите удалить заказ клиента «' +
                          this.getAttribute('data-client') + '» с книгой «' +
                          this.getAttribute('data-book') + '»?');"
                th:attr="data-client=${order.client.fullName}, data-book=${order.book.title}">
            <input type="hidden" name="_method" value="delete" />
            <button type="submit" class="btn btn-sm btn-outline-danger">🗑️ Удалить</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <a th:href="@{/}">Назад на главную страницу</a>
</div>
</body>
</html>
