<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу</title>
</head>
<body>
<h2>Добавить новую книгу</h2>

<form th:action="@{/book}" method="post" th:object="${book}">
    <label>Автор:
        <select th:field="*{author.id}" required>
            <option value="">-- Выберите автора --</option>
            <option th:each="a : ${authors}"
                    th:value="${a.id}"
                    th:text="${a.fullName}">Иванов И.И.</option>
        </select>
    </label><br/><br/>

    <label>Название: <input type="text" th:field="*{title}" required /></label><br/><br/>
    <label>ISBN: <input type="text" th:field="*{isbn}" required /></label><br/><br/>

    <button type="submit">Сохранить</button>
</form>

<a th:href="@{/book}">Назад к списку книг</a>
</body>
</html>
