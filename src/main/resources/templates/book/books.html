<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .table-container { margin-top: 20px; }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="container">
    <h1 class="mb-4">📚 Список книг в библиотеке</h1>

    <div th:replace="message :: error-alert"></div>
    <div th:replace="message :: success-alert"></div>

    <a href="/book/new" class="btn btn-primary mb-3">➕ Добавить новую книгу</a>

    <div class="table-container">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Название</th>
                <th scope="col">Автор</th>
                <th scope="col">ISBN</th>
                <th scope="col">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${books.empty}">
                <td colspan="5" class="text-center text-muted">Нет книг в библиотеке</td>
            </tr>

            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Война и мир</td>
                <td th:text="${book.author.fullName}">Лев Толстой</td>
                <td th:text="${book.isbn}">978-5-17-079223-4</td>
                <td>
                    <a th:href="@{/book/edit/{bookId}(bookId=${book.id})}"
                       class="btn btn-sm btn-outline-warning me-1">✏️ Редактировать</a>

                    <form th:action="@{/book/{bookId}(bookId=${book.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Вы уверены, что хотите удалить книгу «' + this.getAttribute('data-title') + '»?');"
                          th:attr="data-title=${book.title}">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="submit" class="btn btn-sm btn-outline-danger">🗑️ Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}">Назад на главную страницу</a>
</div>
</body>
</html>
